# 腾讯云共存部署：CRM 监听 3001，beproj 继续占用 80
# 首次/升级: docker compose -p hospital-crm -f docker-compose.tencent.yml run --rm migrate
# 启动:     docker compose -p hospital-crm -f docker-compose.tencent.yml up -d

services:
  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env.production
    volumes:
      - crm-data:/app/data
    command: sh -c "npx prisma migrate deploy && chown -R 1001:1001 /app/data"
    profiles:
      - migrate

  app:
    build:
      context: .
      target: runner
    ports:
      - "3001:3000"
    env_file:
      - .env.production
    volumes:
      - crm-data:/app/data
    restart: unless-stopped

volumes:
  crm-data:
