<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>培安 CRM 登录中</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1f2937; }
    .box { text-align: center; padding: 24px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <p>正在进入培安 CRM…</p>
    <p style="font-size:14px;color:#6b7280">如未自动跳转，请点下方链接</p>
    <p><a id="go" href="/api/auth/wecom">继续登录</a></p>
    <p style="margin-top:16px;font-size:13px"><a href="/login">改用账号密码登录</a></p>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var onPhone = /android|iphone|ipod|ipad|mobile/i.test(ua);
      var returnTo = onPhone ? "/mobile/inbox" : "/";
      var target = "/api/auth/wecom?returnTo=" + encodeURIComponent(returnTo);
      document.getElementById("go").href = target;
      setTimeout(function () { window.location.replace(target); }, 50);
    })();
  </script>
</body>
</html>
